name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Without Kani, the Kani tests print a message and pass.
      - run: cargo test

  test-kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The output parser is tested against this version.
      - run: cargo install --locked kani-verifier --version 0.68.0
      - run: cargo kani setup
      # Non-ignored tests (fast; the heap Kani tests self-skip without Kani but
      # are #[ignore]d regardless, so they don't run here).
      - run: cargo test
      # The heap/algebraic Kani tests are #[ignore]d because each runs a real
      # Kani proof and is slow; running all ~118 on every push is impractical
      # (~7 min). Instead run a representative proves-equivalent +
      # catches-divergence pair for each distinct model, so a regression in any
      # model is caught. Keep this list in sync when adding a model.
      #
      # NOTE on the allocator models. All allocator paths now prove as well as
      # catch. The alloc-hook shim lives once in the shared `support` module, so
      # both versions' hook globals hold the identical function pointer and the
      # call sequences line up; a hook that *returns a pointer* (xmlMalloc,
      # xmlMemStrdup) hands back a fresh valid per-version buffer, so the pointee
      # comparison is discharged. The variadic-SAX *prove* case is omitted here
      # only for runtime (~2 min); it proves in the full `--include-ignored`
      # suite, and its catch-direction partner runs below.
      # Run single-threaded: each Kani proof is CPU-bound, and running several
      # at once on a small CI runner starves them, so a heavy-but-valid proof
      # can blow its timeout and spuriously "fail". One at a time each gets a
      # full core and finishes well inside the (generous) per-proof cap.
      - name: Representative heap/algebraic Kani proofs
        run: |
          cargo test --test heap_check -- --test-threads=1 --include-ignored --exact \
            heap_path_proves_equivalent_rewrite \
            heap_path_does_not_prove_a_wrong_rewrite \
            c_string_path_proves_equivalent_rewrite \
            c_string_path_does_not_prove_a_wrong_rewrite \
            tagged_union_path_proves_equivalent_rewrite \
            tagged_union_path_does_not_prove_a_wrong_rewrite \
            variadic_printf_proves_equivalent_rewrite \
            variadic_printf_catches_different_argument \
            external_trace_proves_equivalent_rewrite \
            external_trace_catches_reordered_side_effects \
            scalar_global_side_effect_proves_equivalent_rewrite \
            scalar_global_side_effect_catches_divergence \
            opaque_foreign_type_proves_equivalent_rewrite \
            opaque_foreign_type_catches_divergence \
            goto_dispatch_local_enum_proves_equivalent_rewrite \
            goto_dispatch_local_enum_catches_divergence \
            indirect_call_proves_equivalent_rewrite \
            indirect_call_catches_different_argument \
            mutex_noop_proves_equivalent_rewrite \
            mutex_noop_catches_divergence \
            fp_division_proves_equivalent_rewrite \
            fp_division_catches_swapped_operands \
            loop_relational_proves_equivalent_map_loop \
            loop_relational_catches_divergent_value \
            alloc_hook_proves_equivalent_rewrite \
            alloc_hook_catches_divergence \
            allocator_global_model_proves_equivalent_rewrite \
            allocator_global_model_catches_a_difference \
            strdup_hook_proves_equivalent_rewrite \
            strdup_hook_catches_divergent_result \
            variadic_sax_callback_catches_different_tail_argument \
            raise_error_proves_equivalent_rewrite \
            raise_error_catches_divergent_error_report \
            accessor_global_proves_equivalent_rewrite \
            accessor_global_catches_divergent_write \
            fn_ptr_arg_proves_equivalent_rewrite \
            fn_ptr_arg_catches_different_argument \
            fn_ptr_passed_to_external_proves_equivalent_rewrite \
            fn_ptr_passed_to_external_catches_a_dropped_callback \
            ctx_printer_proves_equivalent_rewrite \
            ctx_printer_catches_divergent_message

  specs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Download TLA+ tools
        run: |
          curl -sSfL -o tla2tools.jar https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  tla2tools.jar" | sha256sum -c
      - name: Download Alloy
        run: |
          curl -sSfL -o alloy.jar https://github.com/AlloyTools/org.alloytools.alloy/releases/download/v6.2.0/org.alloytools.alloy.dist.jar
          echo "6b8c1cb5bc93bedfc7c61435c4e1ab6e688a242dc702a394628d9a9801edb78d  alloy.jar" | sha256sum -c
      - run: specs/check.sh "$PWD/tla2tools.jar"
      - run: specs/check_alloy.py "$PWD/alloy.jar" specs/Heap.als
