[package]
name = "c2rust-equiv"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
description = "Check that rewritten Rust functions behave the same as the originals, using Kani with a differential-testing fallback"
rust-version = "1.74"

[dependencies]
clap = { version = "4", features = ["derive"] }
prettyplease = "0.2"
proc-macro2 = "1"
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit", "visit-mut", "extra-traits"] }
wait-timeout = "0.2"

[dev-dependencies]
tempfile = "3"
